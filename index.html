<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FFMICalc"/>
  <meta name="theme-color" content="#05080f"/>
  <meta name="description" content="Fat Free Mass Index & Waist-to-Height Ratio Calculator"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>FFMI Calc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #05080f;
      --bg2:      #090e1a;
      --bg3:      #0d1525;
      --bg4:      #111d30;
      --cyan:     #00d4ff;
      --cyan-dim: rgba(0,212,255,0.12);
      --cyan-glow:rgba(0,212,255,0.08);
      --teal:     #00b4a0;
      --amber:    #ffb830;
      --red:      #ff4c4c;
      --orange:   #ff7c2a;
      --green:    #2ecc71;
      --text:     #dce8f5;
      --muted:    #4a6080;
      --border:   rgba(0,212,255,0.1);
      --border2:  rgba(0,212,255,0.2);
      --mono:     'Barlow Condensed', sans-serif;
      --body:     'Barlow', sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html, body { min-height: 100dvh; }

    body {
      font-family: var(--body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(40px + var(--safe-bot));
      overscroll-behavior-y: none;
    }

    /* ── Grid bg ── */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .grid-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,212,255,0.05) 0%, transparent 60%);
    }

    #app { position: relative; z-index: 1; }

    /* ── Header ── */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(var(--safe-top) + 14px) 18px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,8,15,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 100;
    }

    .logo-wrap { display: flex; align-items: center; gap: 12px; }

    .logo-icon {
      width: 38px; height: 38px;
      border: 1px solid var(--border2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: var(--cyan-dim);
    }

    .logo-title {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text);
      line-height: 1;
      text-transform: uppercase;
    }

    .logo-title span { color: var(--cyan); }

    .logo-sub {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .reset-btn {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 14px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .reset-btn:active { color: var(--cyan); border-color: var(--cyan); }

    /* ── Main ── */
    .main {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 0;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* ── Section heading ── */
    .section-head {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--mono);
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--cyan);
    }
    .section-head::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--border2), transparent);
    }

    /* ── Input panel ── */
    .input-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }

    .field-label {
      font-family: var(--mono);
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted);
    }

    .input-wrap { position: relative; }

    .input-pre, .input-suf {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-size: 13px;
      color: var(--cyan); pointer-events: none; z-index: 1;
    }
    .input-pre { left: 11px; }
    .input-suf { right: 11px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }

    .field-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 20px; font-weight: 500;
      padding: 11px 12px;
      outline: none;
      -webkit-appearance: none; appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field-input.has-suf { padding-right: 40px; }
    .field-input::placeholder { color: var(--muted); font-size: 14px; }
    .field-input:focus {
      border-color: var(--border2);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
    }
    .field-input[type=number]::-webkit-outer-spin-button,
    .field-input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .field-input[type=number] { -moz-appearance: textfield; }

    /* ── Results ── */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Result card ── */
    .result-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.35s ease both;
    }

    .result-card.full { grid-column: 1 / -1; }

    .result-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--card-accent, var(--cyan));
      opacity: 0.7;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-label {
      font-family: var(--mono);
      font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .card-value {
      font-family: var(--mono);
      font-size: 48px; font-weight: 700; line-height: 1;
      color: var(--card-accent, var(--cyan));
      letter-spacing: -1px;
    }

    .card-value.small { font-size: 36px; }

    .card-unit {
      font-family: var(--mono);
      font-size: 11px; color: var(--muted);
      margin-top: 4px; letter-spacing: 1px;
    }

    /* ── Category badge ── */
    .category-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      position: relative; overflow: hidden;
      animation: slideUp 0.4s ease both;
    }

    .category-card.full { grid-column: 1 / -1; }

    .category-card::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 60% at 0% 100%, var(--cat-glow, rgba(0,212,255,0.06)), transparent);
      pointer-events: none;
    }

    .cat-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }

    .cat-section-label {
      font-family: var(--mono);
      font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted);
    }

    .cat-pill {
      font-family: var(--mono);
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid var(--cat-color, var(--cyan));
      color: var(--cat-color, var(--cyan));
      background: rgba(0,0,0,0.3);
    }

    .cat-name {
      font-family: var(--mono);
      font-size: 26px; font-weight: 700;
      color: var(--cat-color, var(--cyan));
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .cat-desc {
      font-family: var(--body);
      font-size: 12px; color: var(--muted);
      line-height: 1.5;
    }

    /* ── Scale bar ── */
    .scale-wrap {
      margin-top: 14px;
    }

    .scale-track {
      height: 5px;
      border-radius: 99px;
      background: var(--bg4);
      overflow: visible;
      position: relative;
    }

    .scale-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--teal), var(--cat-color, var(--cyan)));
      transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
      max-width: 100%;
    }

    .scale-marker {
      position: absolute;
      top: 50%; transform: translate(-50%, -50%);
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--cat-color, var(--cyan));
      box-shadow: 0 0 8px var(--cat-color, var(--cyan));
      transition: left 0.6s cubic-bezier(0.16,1,0.3,1);
    }

    .scale-labels {
      display: flex; justify-content: space-between;
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 9px; color: var(--muted); letter-spacing: 0.5px;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 48px 24px; text-align: center;
    }

    .empty-title {
      font-family: var(--mono);
      font-size: 20px; font-weight: 700; letter-spacing: 1px;
      color: var(--muted);
    }

    .empty-sub {
      font-size: 13px; color: var(--muted);
      line-height: 1.6; max-width: 260px;
    }

    .empty-icon { opacity: 0.4; }

    /* ── Disclaimer ── */
    .disclaimer {
      font-family: var(--mono);
      font-size: 9px; color: var(--muted);
      line-height: 1.6; text-align: center;
      padding: 14px 8px;
      border-top: 1px solid var(--border);
      letter-spacing: 0.3px;
    }

    /* ── Date + Save row ── */
    .date-save-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      gap: 12px;
    }

    .result-date-wrap { display: flex; flex-direction: column; gap: 3px; }

    .result-date-label {
      font-family: var(--mono);
      font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted);
    }

    .result-date {
      font-family: var(--mono);
      font-size: 15px; font-weight: 600;
      color: var(--cyan);
    }

    .save-btn {
      font-family: var(--mono);
      font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
      background: var(--cyan);
      color: #05080f;
      border: none; border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer; font-weight: 700;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap; flex-shrink: 0;
    }
    .save-btn:active { transform: scale(0.97); }
    .save-btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Storage panel ── */
    .storage-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .storage-meta {
      display: flex; justify-content: space-between; align-items: center;
    }

    .storage-count {
      font-family: var(--mono);
      font-size: 13px; font-weight: 600; color: var(--cyan);
    }

    .storage-used {
      font-family: var(--mono);
      font-size: 10px; color: var(--muted); letter-spacing: 0.5px;
    }

    .storage-track {
      height: 4px; border-radius: 99px;
      background: var(--bg4); overflow: hidden;
    }

    .storage-fill {
      height: 100%; border-radius: 99px;
      background: var(--cyan);
      transition: width 0.5s ease, background 0.3s;
    }

    .history-actions {
      display: flex; gap: 8px;
    }

    .action-btn {
      flex: 1;
      font-family: var(--mono);
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 9px 12px; border-radius: 8px; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      border: none; font-weight: 600;
    }
    .action-btn:active { transform: scale(0.97); }

    .export-btn  { background: rgba(0,212,255,0.15); color: var(--cyan);  border: 1px solid rgba(0,212,255,0.3); }
    .clear-log-btn { background: rgba(255,76,76,0.1);  color: #ff6b6b;   border: 1px solid rgba(255,76,76,0.25); }

    /* ── History empty message ── */
    .history-empty {
      font-family: var(--mono);
      font-size: 11px; color: var(--muted);
      text-align: center; padding: 20px 16px;
      border: 1px dashed var(--border);
      border-radius: 12px; line-height: 1.6;
    }

    /* ── History table ── */
    .table-scroll {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .history-table {
      width: 100%; border-collapse: collapse;
      font-family: var(--mono); font-size: 11px;
      min-width: 520px;
    }

    .history-table thead tr {
      background: var(--bg3);
      border-bottom: 1px solid var(--border2);
    }

    .history-table th {
      padding: 9px 10px;
      text-align: left;
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); white-space: nowrap; font-weight: 600;
    }

    .history-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    .history-table tbody tr:last-child { border-bottom: none; }
    .history-table tbody tr:hover { background: var(--bg3); }

    .history-table td {
      padding: 9px 10px;
      color: var(--text); white-space: nowrap;
    }

    .history-table td.num { color: var(--cyan); }
    .history-table td.cat-cell { color: var(--text); font-size: 10px; }

    .del-btn {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .del-btn:hover { color: #ff4c4c; background: rgba(255,76,76,0.1); }

    .hidden { display: none !important; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>

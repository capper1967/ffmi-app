<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFMI Calculator</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007aff">

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 20px;
    text-align: center;
    background: #f4f6f8;
}
.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}
input, button {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    font-size: 16px;
    border-radius: 8px;
}
button {
    background: #007aff;
    color: white;
    border: none;
}
</style>
</head>

<body>
<div class="container">
<h2>FFMI Calculator</h2>

<input type="number" id="height" placeholder="Height (inches)">
<input type="number" id="weight" placeholder="Weight (lbs)">
<input type="number" id="bodyfat" placeholder="Body Fat %">
<input type="number" id="leanMass" placeholder="Lean Mass (lbs)">

<button onclick="calc()">Calculate</button>

<div id="out"></div>
</div>

<script>
function calc() {
    let h = height.value;
    let w = weight.value;
    let bf = bodyfat.value;
    let lm = leanMass.value;

    if (!h) return out.innerHTML = "Enter height";

    if (!lm && w && bf) {
        lm = w * (1 - bf/100);
    }

    if (!lm) return out.innerHTML = "Enter lean mass OR weight + BF%";

    let hm = h * 0.0254;
    let kg = lm * 0.453592;

    let ffmi = kg / (hm*hm);
    let norm = ffmi + (6.1*(1.8-hm));

    out.innerHTML = `
    FFMI: ${ffmi.toFixed(2)}<br>
    Normalized: ${norm.toFixed(2)}
    `;
}

// Register service worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
